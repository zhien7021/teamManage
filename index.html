      // --- CSV & JSON EXPORT UTILITIES (UTF-8 BOM for Excel Compatibility) ---
      function exportToCSV(filename, headers, rows) {
        const BOM = '\uFEFF';
        const csvRows = [
          headers.map(h => `"${String(h ?? '').replace(/"/g, '""')}"`).join(','),
          ...rows.map(row => row.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(','))
        ];
        const blob = new Blob([BOM + csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a);
      }

      function exportToJSON(filename, data) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a);
      }

          return cats;
        });

        const [eduEquipment, setEduEquipment] = useState(() => {
          const s = localStorage.getItem('frc10114_eduequipment');
          return s ? JSON.parse(s) : INITIAL_EDU_EQUIPMENT;
        });

        // Authentication & View
        const [isAuthenticated, setIsAuthenticated] = useState(() => {
          try {
            return sessionStorage.getItem('frc10114_logged_in') === 'true';
          } catch (e) {
            return false;
          }
        });
        const [currentRole, setCurrentRole] = useState(() => {
          try {
            const r = sessionStorage.getItem('frc10114_role');
            if (r === 'admin' || r === 'member' || r === 'parent') return r;
          } catch (e) {}
          return 'admin';
        });
        const [currentMember, setCurrentMember] = useState(() => {
          try {
            const memId = sessionStorage.getItem('frc10114_member_id');
            if (memId) {
              const found = members.find(m => m.id === memId);
              if (found) return found;
            }
          } catch (e) {}
          return members[0];
        });
        const [parentStudentName, setParentStudentName] = useState(() => {
          try {
            const p = sessionStorage.getItem('frc10114_parent_student');
            if (p) return p;
          } catch (e) {}
          return '林恩萱';
        });
        const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
        const [isExportModalOpen, setIsExportModalOpen] = useState(false);
        const [activeTab, setActiveTab] = useState(() => {
          try {
            const r = sessionStorage.getItem('frc10114_role');
            if (r === 'member') return 'profile';
            if (r === 'parent') return 'portal';
            if (r === 'admin') return 'members';
          } catch (e) {}
          return 'members';
        });

        // Firebase Cloud Sync State
        const [firebaseConfig, setFirebaseConfig] = useState(getSavedFirebaseConfig);
        const [isFirebaseConnected, setIsFirebaseConnected] = useState(false);
        const [isFirebaseModalOpen, setIsFirebaseModalOpen] = useState(false);
        const [isSyncingCloud, setIsSyncingCloud] = useState(false);
        const clientIdRef = React.useRef(Math.random().toString(36).substring(2, 9));
        const isRemoteUpdateRef = React.useRef(false);

        // Auto-detect shared public/firebase-config.json for seamless zero-config cloud sync
        useEffect(() => {
          if (!firebaseConfig) {
            fetch('./firebase-config.json')
              .then(res => res.ok ? res.json() : null)
              .then(cfg => {
                if (cfg && cfg.apiKey && cfg.projectId) {
                  setFirebaseConfig(cfg);
                  try {
                    localStorage.setItem('frc10114_firebase_config', JSON.stringify(cfg));
                  } catch (e) {}
                }
              })
              .catch(() => {});
          }
        }, [firebaseConfig]);

        // Add Admin Modal State
        const [isAddAdminModalOpen, setIsAddAdminModalOpen] = useState(false);

        // Unsaved Guard State for Member Management
        const [draftMember, setDraftMember] = useState(members[0]);
        const [selectedMemberId, setSelectedMemberId] = useState(members[0].id);
        const [pendingSwitchMemberId, setPendingSwitchMemberId] = useState(null);
        const [isUnsavedModalOpen, setIsUnsavedModalOpen] = useState(false);

        // Toast Messages
        const [toasts, setToasts] = useState([]);

        const showToast = (title, message, type = 'info') => {
          const id = Date.now().toString() + Math.random().toString(36).slice(2, 5);
          setToasts(prev => [...prev, { id, title, message, type }]);
          setTimeout(() => {
            setToasts(prev => prev.filter(t => t.id !== id));
          }, 4500);
        };

        // Sync to LocalStorage
        useEffect(() => { localStorage.setItem('frc10114_members', JSON.stringify(members)); }, [members]);
        useEffect(() => { localStorage.setItem('frc10114_events', JSON.stringify(events)); }, [events]);
        useEffect(() => { localStorage.setItem('frc10114_tasks', JSON.stringify(tasks)); }, [tasks]);
        useEffect(() => { localStorage.setItem('frc10114_pending_tasks', JSON.stringify(pendingTasks)); }, [pendingTasks]);
        useEffect(() => { localStorage.setItem('frc10114_materials', JSON.stringify(materials)); }, [materials]);
        useEffect(() => { localStorage.setItem('frc10114_attendance', JSON.stringify(attendance)); }, [attendance]);
        useEffect(() => { localStorage.setItem('frc10114_saved_events', JSON.stringify(customSavedEventIds)); }, [customSavedEventIds]);
        useEffect(() => { localStorage.setItem('frc10114_reservations', JSON.stringify(machineReservations)); }, [machineReservations]);
        useEffect(() => { localStorage.setItem('frc10114_edu_categories', JSON.stringify(eduCategories)); }, [eduCategories]);
        useEffect(() => { localStorage.setItem('frc10114_eduequipment', JSON.stringify(eduEquipment)); }, [eduEquipment]);

        // Real-time Firestore sync listener (Dual-Engine)
        useEffect(() => {
          if (!firebaseConfig) {
            setIsFirebaseConnected(false);
            return;
          }
          let unsub = null;
          try {
            const db = initFirestore(firebaseConfig);
            if (!db) {
              setIsFirebaseConnected(false);
              return;
            }
            unsub = db.collection('frc10114_teams').doc('team_state').onSnapshot((doc) => {
              setIsFirebaseConnected(true);
              if (doc.exists) {
                const data = doc.data();
                if (data && data.updatedBy !== clientIdRef.current) {
                  isRemoteUpdateRef.current = true;
                  if (data.members && Array.isArray(data.members)) setMembers(data.members);
                  if (data.events && Array.isArray(data.events)) setEvents(data.events);
                  if (data.tasks && Array.isArray(data.tasks)) setTasks(data.tasks);
                  if (data.pendingTasks && Array.isArray(data.pendingTasks)) setPendingTasks(data.pendingTasks);
                  if (data.materials && Array.isArray(data.materials)) setMaterials(data.materials);
                  if (data.attendance && Array.isArray(data.attendance)) setAttendance(data.attendance);
                  if (data.reservations && Array.isArray(data.reservations)) setMachineReservations(data.reservations);
                  if (data.eduCategories && Array.isArray(data.eduCategories)) setEduCategories(data.eduCategories);
                  if (data.eduEquipment && Array.isArray(data.eduEquipment)) setEduEquipment(data.eduEquipment);
                }
              }
            }, (err) => {
              console.warn('Firestore snapshot error:', err);
              setIsFirebaseConnected(false);
            });
          } catch (e) {
            console.warn('Firebase listener error:', e);
            setIsFirebaseConnected(false);
          }
          return () => { if (unsub) unsub(); };
        }, [firebaseConfig]);

        // Push state changes to Cloud Firestore
        const syncToCloud = async (overrideData = null) => {
          if (!firebaseConfig) return false;
          try {
            const db = initFirestore(firebaseConfig);
            if (!db) return false;
            setIsSyncingCloud(true);
            const payload = overrideData || {
              members,
              events,
              tasks,
              pendingTasks,
              materials,
              attendance,
              reservations: machineReservations,
              eduCategories,
              eduEquipment,
              updatedAt: Date.now(),
              updatedBy: clientIdRef.current,
            };
            await db.collection('frc10114_teams').doc('team_state').set(payload, { merge: true });
            setIsFirebaseConnected(true);
            setIsSyncingCloud(false);
            return true;
          } catch (e) {
            console.error('Push to Firestore failed:', e);
            setIsSyncingCloud(false);
            return false;
          }
        };

        // Debounced auto sync to Firebase when connected (prevents echo loops)
        useEffect(() => {
          if (isRemoteUpdateRef.current) {
            isRemoteUpdateRef.current = false;
            return;
          }
          if (isFirebaseConnected && firebaseConfig) {
            const timer = setTimeout(() => {
              syncToCloud();
            }, 1000);
            return () => clearTimeout(timer);
          }
        }, [members, events, tasks, pendingTasks, materials, attendance, machineReservations, eduCategories, eduEquipment, isFirebaseConnected]);

        // Keep draft in sync with selected member
        useEffect(() => {
          const cur = members.find(m => m.id === selectedMemberId) || members[0];
          if (cur) {
            setDraftMember({ ...cur, departments: [...cur.departments] });
          }
        }, [selectedMemberId, members]);

        // Check if draft is dirty
        const originalMember = members.find(m => m.id === selectedMemberId);
        const isDraftDirty = useMemo(() => {
          if (!draftMember || !originalMember) return false;
          const basicDiff =
            draftMember.name !== originalMember.name ||
            draftMember.id !== originalMember.id ||
            draftMember.email !== originalMember.email ||
            (draftMember.motto || '') !== (originalMember.motto || '') ||
            (draftMember.phone || '') !== (originalMember.phone || '') ||
            (draftMember.avatar || '') !== (originalMember.avatar || '') ||
            (draftMember.password || '') !== (originalMember.password || '') ||
            (draftMember.role || 'member') !== (originalMember.role || 'member');
          const deptsDiff =
            draftMember.departments.length !== originalMember.departments.length ||
            !draftMember.departments.every(d => originalMember.departments.includes(d));
          return basicDiff || deptsDiff;
        }, [draftMember, originalMember]);

        // Auto sorted events by date + startTime ascending (NEAREST FIRST)
        const sortedEvents = useMemo(() => {
          return [...events].sort((a, b) =>
            `${a.date}T${a.startTime}`.localeCompare(`${b.date}T${b.startTime}`)
          );
        }, [events]);

        // Auto sorted members by ID / number ascending
        const sortedMembers = useMemo(() => {
          return [...members].sort((a, b) =>
            (a.id || '').localeCompare(b.id || '', undefined, { numeric: true, sensitivity: 'base' })
          );
        }, [members]);

        // Handle Add New Admin Coach
        const handleCreateAdmin = (adminData) => {
          const newAdmin = {
            id: adminData.id.trim(),
            name: adminData.name.trim(),
            email: adminData.email.trim() || `${adminData.id}@frc10114.org`,
            phone: adminData.phone || '',
            departments: adminData.departments && adminData.departments.length > 0 ? adminData.departments : ['機電整合組', '程式控制組', '行銷管理組'],
            motto: adminData.motto || '用心傳承，帶領 FRC 10114 勇闖巔峰！',
            role: 'admin',
            password: adminData.password || '10114admin',
          };
          if (!newAdmin.name || !newAdmin.id) {
            showToast('建立失敗', '姓名與編號為必填項目', 'error');
            return false;
          }
          if (members.some(m => m.id === newAdmin.id)) {
            showToast('建立失敗', `編號 ${newAdmin.id} 已存在，請使用不同編號`, 'warning');
            return false;
          }
          const next = [newAdmin, ...members];
          setMembers(next);
          setSelectedMemberId(newAdmin.id);
          try { localStorage.setItem('frc10114_members', JSON.stringify(next)); } catch (e) {}
          syncToCloud({ members: next });
          setIsAddAdminModalOpen(false);
          showToast('管理員建立成功！', `已新增「${newAdmin.name}」為管理員教練`, 'success');
          return true;
        };

        // Handle Password Update for Current Member
        const handleUpdatePassword = (memberId, oldPass, newPass) => {
          const target = members.find(m => m.id === memberId);
          if (!target) return false;
          const currentPass = target.password || (target.role === 'admin' || target.id === '10114-001' ? '10114admin' : '10114');
          if (oldPass !== currentPass) {
            showToast('密碼變更失敗', '舊密碼輸入錯誤，請確認後重試', 'error');
            return false;
          }
          if (!newPass || newPass.trim().length < 4) {
            showToast('密碼變更失敗', '新密碼長度至少需 4 個字元', 'warning');
            return false;
          }
          const trimmed = newPass.trim();
          const nextMembers = members.map(m => m.id === memberId ? { ...m, password: trimmed } : m);
          setMembers(nextMembers);
          if (currentMember && currentMember.id === memberId) {
            setCurrentMember(prev => ({ ...prev, password: trimmed }));
          }
          if (draftMember && draftMember.id === memberId) {
            setDraftMember(prev => ({ ...prev, password: trimmed }));
          }
          try { localStorage.setItem('frc10114_members', JSON.stringify(nextMembers)); } catch (e) {}
          syncToCloud({ members: nextMembers });
          showToast('密碼已成功更新！', '請牢記您的新密碼', 'success');
          return true;
        };

        // Role select & login handler
        const handleLoginSelect = (role, memberObj, studentName) => {
          setCurrentRole(role);
          setIsAuthenticated(true);
          try {
            sessionStorage.setItem('frc10114_logged_in', 'true');
            sessionStorage.setItem('frc10114_role', role);
          } catch (e) {}

          if (role === 'admin') {
            const admin = memberObj || members.find(m => m.id === '10114-001') || members[0];
            setCurrentMember(admin);
            setActiveTab('members');
            try { sessionStorage.setItem('frc10114_member_id', admin.id); } catch (e) {}
            showToast('歡迎管理員教練', '已進入 FRC 10114 管理後台', 'success');
          } else if (role === 'member') {
            const m = memberObj || members.find(x => x.id === '10114-002') || members[0];
            setCurrentMember(m);
            setActiveTab('profile');
            try { sessionStorage.setItem('frc10114_member_id', m.id); } catch (e) {}
            showToast(`歡迎隊員 ${m.name}`, `已進入個人專屬頁面 (所屬：${m.departments.join(' / ')})`, 'success');
          } else if (role === 'parent') {
            const name = studentName || '林恩萱';
            setParentStudentName(name);
            setActiveTab('portal');
            try { sessionStorage.setItem('frc10114_parent_student', name); } catch (e) {}
            showToast('家長關心專區已就緒', `歡迎關心 ${name} 的留校實作進度`, 'info');
          }
          setIsLoginModalOpen(false);
        };

        // Logout handler (resets authentication and returns to login screen)
        const handleLogout = () => {
          setIsAuthenticated(false);
          try {
            sessionStorage.removeItem('frc10114_logged_in');
            sessionStorage.removeItem('frc10114_role');
            sessionStorage.removeItem('frc10114_member_id');
            sessionStorage.removeItem('frc10114_parent_student');
          } catch (e) {}
          showToast('已登出系統', '感謝使用 FRC 10114 隊務系統，歡迎隨時登入', 'info');
        };

        // Switch member with unsaved warning
        const handleSwitchMember = (nextId) => {
          if (nextId === selectedMemberId) return;
          if (isDraftDirty) {
            setPendingSwitchMemberId(nextId);
            setIsUnsavedModalOpen(true);
          } else {
            setSelectedMemberId(nextId);
          }
        };

        const handleSaveDraft = () => {
          if (!draftMember.name.trim() || !draftMember.id.trim()) {
            showToast('儲存失敗', '姓名與編號不得為空', 'error');
            return;
          }
          if (draftMember.departments.length === 0) {
            showToast('儲存失敗', '請至少勾選一個組別', 'warning');
            return;
          }
          const nextMembers = members.map(m =>
            (m.id === selectedMemberId || m.id === draftMember.id) ? draftMember : m
          );
          setMembers(nextMembers);
          if (currentMember.id === selectedMemberId || currentMember.id === draftMember.id) {
            setCurrentMember(draftMember);
          }
          setSelectedMemberId(draftMember.id);
          try { localStorage.setItem('frc10114_members', JSON.stringify(nextMembers)); } catch (e) {}
          syncToCloud({ members: nextMembers });
          showToast('資料儲存成功', `隊員「${draftMember.name}」已更新並即時同步至雲端！`, 'success');
        };

        const handleUpdateProfile = (updatedProfile) => {
          if (!updatedProfile.name?.trim()) {
            showToast('儲存失敗', '姓名不得為空', 'error');
            return false;
          }
          const nextMembers = members.map(m => m.id === updatedProfile.id ? { ...m, ...updatedProfile } : m);
          setMembers(nextMembers);
          setCurrentMember(prev => ({ ...prev, ...updatedProfile }));
          if (draftMember && draftMember.id === updatedProfile.id) {
            setDraftMember(prev => ({ ...prev, ...updatedProfile }));
          }
          try { localStorage.setItem('frc10114_members', JSON.stringify(nextMembers)); } catch (e) {}
          syncToCloud({ members: nextMembers });
          showToast('個人資料儲存成功！', '您的資料與理念已即時同步至雲端', 'success');
          return true;
        };

        const handleSaveMotto = (memberId, newMotto) => {
          const nextMembers = members.map(m => m.id === memberId ? { ...m, motto: newMotto } : m);
          setMembers(nextMembers);
          if (currentMember.id === memberId) {
            setCurrentMember(prev => ({ ...prev, motto: newMotto }));
          }
          if (draftMember.id === memberId) {
            setDraftMember(prev => ({ ...prev, motto: newMotto }));
          }
          try { localStorage.setItem('frc10114_members', JSON.stringify(nextMembers)); } catch (e) {}
          syncToCloud({ members: nextMembers });
          showToast('座右銘已儲存', '隨時提醒自己當初加入 FRC 時的初心！', 'success');
        };

        // 學習集章 (tasks) - Verify, Add, Delete
        const handleVerifyTask = (taskId, studentName, taskName) => {
          const now = new Date();
          const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
          const nextTasks = tasks.map(t => t.id === taskId ? { ...t, status: 'completed', verifiedAt: dateStr, verifiedBy: currentMember.name || '許教練' } : t);
          setTasks(nextTasks);
          try { localStorage.setItem('frc10114_tasks', JSON.stringify(nextTasks)); } catch (e) {}
          syncToCloud({ tasks: nextTasks });
          showToast('任務審核通過！', `隊員「${studentName}」的「${taskName}」已完成蓋章核可！`, 'success');
        };

        const handleAddTask = (t) => {
          const newTask = { ...t, id: Date.now(), status: 'pending' };
          const nextTasks = [...tasks, newTask];
          setTasks(nextTasks);
          try { localStorage.setItem('frc10114_tasks', JSON.stringify(nextTasks)); } catch (e) {}
          syncToCloud({ tasks: nextTasks });
          showToast('已指派學習任務', `已建立「${t.taskName}」`, 'success');
        };

        const handleDeleteTask = (taskId, studentName, taskName) => {
          if (window.confirm(`確定要刪除隊員「${studentName}」的「${taskName}」學習集章任務嗎？`)) {
            const nextTasks = tasks.filter(t => t.id !== taskId);
            setTasks(nextTasks);
            try { localStorage.setItem('frc10114_tasks', JSON.stringify(nextTasks)); } catch (e) {}
            syncToCloud({ tasks: nextTasks });
            showToast('學習集章已刪除', `已移除「${taskName}」(${studentName})`, 'info');
          }
        };

        // 工作任務清單 (pendingTasks) - Add, Delete, Toggle
        const handleAddPendingTask = (newTask) => {
          const now = new Date();
          const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
          const task = {
            id: `task-${Date.now()}`,
            title: newTask.title.trim(),
            department: newTask.department,
            description: newTask.description?.trim() || '',
            status: 'todo',
            createdAt: dateStr,
          };
          const next = [task, ...pendingTasks];
          setPendingTasks(next);
          try { localStorage.setItem('frc10114_pending_tasks', JSON.stringify(next)); } catch (e) {}
          syncToCloud({ pendingTasks: next });
          showToast('工作任務已建立', `已新增任務「${task.title}」至 ${task.department}`, 'success');
        };

        const handleDeletePendingTask = (taskId, title) => {
          if (window.confirm(`確定要刪除工作任務「${title}」嗎？`)) {
            const next = pendingTasks.filter(t => t.id !== taskId);
            setPendingTasks(next);
            try { localStorage.setItem('frc10114_pending_tasks', JSON.stringify(next)); } catch (e) {}
            syncToCloud({ pendingTasks: next });
            showToast('工作任務已刪除', `已移除「${title}」`, 'info');
          }
        };

        const handleTogglePendingTask = (taskId, currentStatus, title) => {
          const nextStatus = currentStatus === 'todo' ? 'completed' : 'todo';
          const now = new Date();
          const timeStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
          const next = pendingTasks.map(t => t.id === taskId ? { ...t, status: nextStatus, completedAt: nextStatus === 'completed' ? timeStr : undefined } : t);
          setPendingTasks(next);
          try { localStorage.setItem('frc10114_pending_tasks', JSON.stringify(next)); } catch (e) {}
          syncToCloud({ pendingTasks: next });
          if (nextStatus === 'completed') {
            showToast('任務已標示完成！', `「${title}」已移入已完成區域`, 'success');
          } else {
            showToast('任務重設為進行中', `「${title}」已回到待辦項目`, 'info');
          }
        };

        const handleDiscardDraft = () => {
          if (originalMember) {
            setDraftMember({ ...originalMember, departments: [...originalMember.departments] });
            showToast('已還原草稿', '已放棄未儲存的變更內容', 'info');
          }
        };

        const handleUpdateMemberAvatar = (memberId, avatarDataUrl) => {
          const nextMembers = members.map(m => m.id === memberId ? { ...m, avatar: avatarDataUrl } : m);
          setMembers(nextMembers);
          if (currentMember && currentMember.id === memberId) {
            setCurrentMember(prev => ({ ...prev, avatar: avatarDataUrl }));
          }
          if (draftMember && draftMember.id === memberId) {
            setDraftMember(prev => ({ ...prev, avatar: avatarDataUrl }));
          }
          try { localStorage.setItem('frc10114_members', JSON.stringify(nextMembers)); } catch (e) {}
          syncToCloud({ members: nextMembers });
          showToast('個人頭貼已更新', '頭貼相片已成功儲存！', 'success');
        };

        const handleRemoveMemberAvatar = (memberId) => {
          const nextMembers = members.map(m => m.id === memberId ? { ...m, avatar: undefined } : m);
          setMembers(nextMembers);
          if (currentMember && currentMember.id === memberId) {
            setCurrentMember(prev => ({ ...prev, avatar: undefined }));
          }
          if (draftMember && draftMember.id === memberId) {
            setDraftMember(prev => ({ ...prev, avatar: undefined }));
          }
          try { localStorage.setItem('frc10114_members', JSON.stringify(nextMembers)); } catch (e) {}
          syncToCloud({ members: nextMembers });
          showToast('已移除個人頭貼', '已還原為姓氏字母頭像', 'info');
        };

        const handleSaveAndProceedSwitch = () => {
          handleSaveDraft();
          if (pendingSwitchMemberId) {
            setSelectedMemberId(pendingSwitchMemberId);
          }
          setIsUnsavedModalOpen(false);
          setPendingSwitchMemberId(null);
        };

        const handleDiscardAndProceedSwitch = () => {
          if (pendingSwitchMemberId) {
            setSelectedMemberId(pendingSwitchMemberId);
          }
          setIsUnsavedModalOpen(false);
          setPendingSwitchMemberId(null);
          showToast('已切換隊員', '已放棄先前未儲存的修改', 'info');
        };

        // Reset factory seed
        const handleResetFactory = () => {
          if (window.confirm('確定要清除自訂紀錄並恢復為 FRC 10114 預設資料庫嗎？')) {
            setMembers(INITIAL_MEMBERS);
            setEvents(INITIAL_EVENTS);
            setTasks(INITIAL_TASKS);
            setPendingTasks(INITIAL_PENDING_TASKS);
            setMaterials(INITIAL_MATERIALS);
            setAttendance(INITIAL_ATTENDANCE);
            setMachineReservations(INITIAL_MACHINE_RESERVATIONS);
            setEduCategories(INITIAL_EDU_CATEGORIES);
            setEduEquipment(INITIAL_EDU_EQUIPMENT);
            setCustomSavedEventIds([3]);
            localStorage.clear();
            showToast('資料重設完成', '已還原為原廠示範資料庫', 'info');
          }
        };

        // Restore from JSON backup payload
        const handleRestoreBackup = (payload) => {
          if (payload.members) setMembers(payload.members);
          if (payload.events) setEvents(payload.events);
          if (payload.tasks) setTasks(payload.tasks);
          if (payload.pendingTasks) setPendingTasks(payload.pendingTasks);
          if (payload.materials) setMaterials(payload.materials);
          if (payload.attendance) setAttendance(payload.attendance);
          if (payload.machineReservations) setMachineReservations(payload.machineReservations);
          if (payload.eduCategories) setEduCategories(payload.eduCategories);
          if (payload.eduEquipment) setEduEquipment(payload.eduEquipment);
          showToast('系統資料還原成功！', '已從 JSON 備份檔恢復所有最新隊務紀錄', 'success');
        };

        // Booking & Equipment actions
        const handleAddMachineReservation = (machine, date, slots, studentId, studentName, purpose) => {
          const now = new Date();
          const timeStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

          const newItems = slots.map((s, idx) => ({
            id: `res-${Date.now()}-${idx}`,
            machine,
            date,
            timeSlot: s,
            studentId,
            studentName,
            purpose,
            createdAt: timeStr,
          }));

          setMachineReservations(prev => [...prev, ...newItems]);
          showToast('機具預約成功！', `已預約 ${machine}（${date} 共 ${slots.length} 小時時段）`, 'success');
        };

        const handleCancelMachineReservation = (resId, machine, slot) => {
          setMachineReservations(prev => prev.filter(r => r.id !== resId));
          showToast('預約已取消', `已釋出 ${machine} ${slot} 時段`, 'info');
        };

        // Educational Equipment Borrow & Return
        const handleBorrowEduEquipment = (itemId, borrowerName, notes) => {
          const now = new Date();
          const timeStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

          setEduEquipment(prev => prev.map(eq =>
            eq.id === itemId
              ? { ...eq, status: 'borrowed', borrowedBy: borrowerName, borrowedAt: timeStr, notes }
              : eq
          ));
          showToast('設備出借登記成功', `已登記借給 ${borrowerName}`, 'success');
        };

        const handleReturnEduEquipment = (itemId, itemName) => {
          setEduEquipment(prev => prev.map(eq =>
            eq.id === itemId
              ? { ...eq, status: 'available', borrowedBy: undefined, borrowedAt: undefined, notes: undefined }
              : eq
          ));
          showToast('設備已歸還', `「${itemName}」已歸還，恢復為空著可借用狀態`, 'info');
        };

        // Educational Equipment Categories & Quantity Management
        const handleAddEduCategory = (newCat, initialCount = 0, namePattern = '') => {
          setEduCategories(prev => {
            if (prev.some(c => c.id === newCat.id)) return prev;
            return [...prev, newCat];
          });
          if (initialCount > 0) {
            const newItems = Array.from({ length: initialCount }, (_, i) => {
              const pad = String(i + 1).padStart(2, '0');
              const prefix = newCat.prefix || 'EQ';
              return {
                id: `${prefix}-${pad}-${Date.now().toString().slice(-4)}`,
                number: pad,
                category: newCat.id,
                name: namePattern ? namePattern.replace('{n}', pad).replace('{name}', newCat.name) : `${newCat.name} ${pad}號`,
                status: 'available',
                notes: '全新建置設備',
              };
            });
            setEduEquipment(prev => [...prev, ...newItems]);
          }
          showToast('設備種類建立成功', `已新增「${newCat.name}」${initialCount > 0 ? `與 ${initialCount} 台初始設備` : ''}`, 'success');
        };

        const handleDeleteEduCategory = (categoryId) => {
          setEduCategories(prev => prev.filter(c => c.id !== categoryId));
          setEduEquipment(prev => prev.filter(e => e.category !== categoryId));
          showToast('設備種類已刪除', `已移除「${categoryId}」及其下所有設備`, 'info');
        };

        const handleAdjustEduQuantity = (categoryId, targetCount, catPrefix, catName) => {
          let outcome = 'same';
          setEduEquipment(prev => {
            const currentCatItems = prev.filter(e => e.category === categoryId);
            const currentCount = currentCatItems.length;

            if (targetCount === currentCount) {
              outcome = 'same';
              return prev;
            }

            if (targetCount > currentCount) {
              outcome = 'increased';
              let maxNum = 0;
              currentCatItems.forEach(it => {
                const n = parseInt(it.number, 10);
                if (!isNaN(n) && n > maxNum) maxNum = n;
              });

              const addCount = targetCount - currentCount;
              const newItems = Array.from({ length: addCount }, (_, i) => {
                const numVal = maxNum + i + 1;
                const pad = String(numVal).padStart(2, '0');
                const prefix = catPrefix || 'EQ';
                return {
                  id: `${prefix}-${pad}-${Date.now().toString().slice(-4)}`,
                  number: pad,
                  category: categoryId,
                  name: `${catName || categoryId} ${pad}號`,
                  status: 'available',
                  notes: '批次擴充設備',
                };
              });
              return [...prev, ...newItems];
            } else {
              const diff = currentCount - targetCount;
              const availableItems = currentCatItems.filter(e => e.status !== 'borrowed');
              if (availableItems.length < diff) {
                outcome = 'blocked';
                return prev;
              }
              outcome = 'decreased';
              const toRemoveIds = new Set(availableItems.slice(-diff).map(e => e.id));
              return prev.filter(e => !toRemoveIds.has(e.id));
            }
          });

          if (outcome === 'blocked') {
            showToast('無法減少至目標數量', '目前有借出中的設備無法直接刪除，請先辦理歸還！', 'warning');

          }
        };

                                  onChange={(e) => {
                                    const file = e.target.files && e.target.files[0];
                                    if (!file) return;
                                    const reader = new FileReader();
                                    reader.onload = (event) => {
                                      const img = new Image();
                                      img.onload = () => {
                                        const maxDim = 320;
                                        let width = img.width;
                                        let height = img.height;
                                        if (width > height) {
                                          if (width > maxDim) {
                                            height = Math.round((height * maxDim) / width);
                                            width = maxDim;
                                          }
                                        } else {
                                          if (height > maxDim) {
                                            width = Math.round((width * maxDim) / height);
                                            height = maxDim;
                                          }
                                        }
                                        const canvas = document.createElement('canvas');
                                        canvas.width = width;
                                        canvas.height = height;
                                        const ctx = canvas.getContext('2d');
                                        ctx.drawImage(img, 0, 0, width, height);
                                        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                                        setDraftMember(prev => ({ ...prev, avatar: dataUrl }));
                                      };
                                      img.src = event.target.result;
                                    };
                                    reader.readAsDataURL(file);
                                    e.target.value = '';
                                  }}

      // --- 4. UNIFIED EQUIPMENT, MACHINE RESERVATIONS & EDU EQUIPMENT COMPONENT ---

        onAddReservation,

        const toggleCheckSlot = (slotStr) => {
          setCheckedSlots(prev =>
            prev.includes(slotStr) ? prev.filter(s => s !== slotStr) : [...prev, slotStr]

        const handleConfirmReservation = (e) => {
          e.preventDefault();
          if (checkedSlots.length === 0) return;
          if (!reservationPurpose.trim()) return;

          const student = members.find(m => m.id === targetStudentId) || currentMember;
          onAddReservation(
            selectedMachine,
            selectedDate,
            checkedSlots,
            student.id,
            student.name,
            reservationPurpose.trim()

          setCheckedSlots([]);
          setReservationPurpose('');

        useEffect(() => {
          if (eduCategories.length > 0 && !eduCategories.some(c => c.id === selectedEduCategory)) {

        const [newItemName, setNewItemName] = useState('');
        const [newItemNotes, setNewItemNotes] = useState('');

        const [editItemModalItem, setEditItemModalItem] = useState(null);

        const [editItemName, setEditItemName] = useState('');
        const [editItemNotes, setEditItemNotes] = useState('');
        const [editItemStatus, setEditItemStatus] = useState('available');
        const [editItemBorrower, setEditItemBorrower] = useState('');

        const currentCatObj = eduCategories.find(c => c.id === selectedEduCategory) || {

            e.number.toLowerCase().includes(q) ||
            e.id.toLowerCase().includes(q) ||
            (e.name && e.name.toLowerCase().includes(q)) ||
            (e.borrowedBy && e.borrowedBy.toLowerCase().includes(q)) ||
            (e.notes && e.notes.toLowerCase().includes(q))

      // --- 5.1 REUSABLE MONTH CALENDAR VIEW COMPONENT ---
      function MonthCalendarView({
        events,
        isAdmin = false,
        onDeleteEvent,
        onOpenAddEvent,
        savedIds = [],
        onToggleSave,
        currentMember,
      }) {
        // Start in September 2026 as per season seed data
        const [viewDate, setViewDate] = useState(() => new Date(2026, 8, 1));
        const [selectedDateStr, setSelectedDateStr] = useState('2026-09-18');
        const [catFilter, setCatFilter] = useState('all');

        const year = viewDate.getFullYear();
        const month = viewDate.getMonth(); // 0-indexed (8 = Sep)

        const prevMonth = () => {
          setViewDate(new Date(year, month - 1, 1));
        };

        const nextMonth = () => {
          setViewDate(new Date(year, month + 1, 1));
        };

        const goToday = () => {
          setViewDate(new Date(2026, 8, 1));
          setSelectedDateStr('2026-09-17');
        };

        // Filter events by catFilter if applied
        const visibleEvents = events.filter(e => {
          if (catFilter !== 'all' && e.type !== catFilter) return false;
          return true;
        });

        // Calculate grid days
        const firstDayOfWeek = new Date(year, month, 1).getDay(); // 0 (Sun) - 6 (Sat)
        const daysInCurrentMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();

        const gridDays = [];

        // Previous month filler days
        for (let i = firstDayOfWeek - 1; i >= 0; i--) {
          const d = daysInPrevMonth - i;
          const prevD = new Date(year, month - 1, d);
          const dateStr = `${prevD.getFullYear()}-${String(prevD.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          gridDays.push({
            dayNum: d,
            dateStr,
            isCurrentMonth: false,
            isToday: false,
          });
        }

        // Current month days
        const todayStr = '2026-09-17';
        for (let d = 1; d <= daysInCurrentMonth; d++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          gridDays.push({
            dayNum: d,
            dateStr,
            isCurrentMonth: true,
            isToday: dateStr === todayStr,
          });
        }

        // Next month filler days to complete either 35 or 42 cells
        const totalTarget = gridDays.length <= 35 ? 35 : 42;
        let nextD = 1;
        while (gridDays.length < totalTarget) {
          const nextDate = new Date(year, month + 1, nextD);
          const dateStr = `${nextDate.getFullYear()}-${String(nextDate.getMonth() + 1).padStart(2, '0')}-${String(nextD).padStart(2, '0')}`;
          gridDays.push({
            dayNum: nextD,
            dateStr,
            isCurrentMonth: false,
            isToday: false,
          });
          nextD++;
        }

        // Events on selected day
        const selectedDayEvents = visibleEvents.filter(e => e.date === selectedDateStr);

        const getCategoryBadgeColor = (type) => {
          switch (type) {
            case '機電整合組培訓':
              return 'bg-blue-100 text-blue-800 border-blue-200';
            case '程式設計組培訓':
              return 'bg-emerald-100 text-emerald-800 border-emerald-200';
            case '行銷管理組培訓':
              return 'bg-purple-100 text-purple-800 border-purple-200';
            case '多元競賽':
              return 'bg-orange-100 text-orange-900 border-orange-300';
            case '教育推廣':
              return 'bg-cyan-100 text-cyan-800 border-cyan-200';
            case '團隊經營':
              return 'bg-rose-100 text-rose-800 border-rose-200';
            case '國際交流':
              return 'bg-amber-100 text-amber-900 border-amber-300';
            default:
              return 'bg-zinc-100 text-zinc-800 border-zinc-200';
          }
        };

        const weekdayNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

        return (
          <div className="space-y-6">
            {/* Calendar Controls Header */}
            <div className="bg-white border border-zinc-200 rounded-xl p-4 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              {/* Month Navigator */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-1 bg-zinc-100 p-1 rounded-lg border border-zinc-200">
                  <button
                    type="button"
                    onClick={prevMonth}
                    className="p-1.5 hover:bg-white rounded-md text-zinc-700 hover:shadow-xs transition-all"
                    title="上個月"
                  >
                    <Icon name="chevronLeft" className="w-4 h-4" />
                  </button>
                  <button
                    type="button"
                    onClick={goToday}
                    className="px-2.5 py-1 text-xs font-bold text-zinc-700 hover:bg-white rounded-md transition-all"
                  >
                    今天 (2026/09)
                  </button>
                  <button
                    type="button"
                    onClick={nextMonth}
                    className="p-1.5 hover:bg-white rounded-md text-zinc-700 hover:shadow-xs transition-all"
                    title="下個月"
                  >
                    <Icon name="chevronRight" className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex items-baseline gap-2">
                  <h3 className="text-lg font-black text-zinc-900 tracking-tight">
                    {year} 年 {month + 1} 月
                  </h3>
                  <span className="text-xs font-semibold text-zinc-400">
                    (共 {visibleEvents.filter(e => e.date.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`)).length} 場活動)
                  </span>
                </div>
              </div>

              {/* Type Category Filter */}
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-zinc-500">分類：</span>
                <select
                  value={catFilter}
                  onChange={(e) => setCatFilter(e.target.value)}
                  className="p-1.5 bg-zinc-50 border border-zinc-300 rounded-lg text-xs font-medium text-zinc-800"
                >
                  <option value="all">全活動分類</option>
                  {[
                    '機電整合組培訓',
                    '程式設計組培訓',
                    '行銷管理組培訓',
                    '多元競賽',
                    '教育推廣',
                    '團隊經營',
                    '國際交流',
                  ].map(c => (
                    <option key={c} value={c}>{c}</option>
                  ))}
                </select>

                {isAdmin && onOpenAddEvent && (
                  <button
                    type="button"
                    onClick={() => onOpenAddEvent(selectedDateStr)}
                    className="flex items-center gap-1.5 px-3 py-1.5 bg-orange-600 hover:bg-orange-700 text-white font-semibold text-xs rounded-lg shadow-xs transition-colors"
                  >
                    <Icon name="plus" className="w-3.5 h-3.5" />
                    <span>在此月排程</span>
                  </button>
                )}
              </div>
            </div>

            {/* Monthly Calendar Grid */}
            <div className="bg-white border border-zinc-200 rounded-2xl shadow-xs overflow-hidden">
              {/* Weekday Header Row */}
              <div className="grid grid-cols-7 border-b border-zinc-200 bg-zinc-50 text-center">
                {weekdayNames.map((w, idx) => (
                  <div
                    key={w}
                    className={`py-2.5 text-xs font-extrabold ${
                      idx === 0 || idx === 6 ? 'text-orange-600' : 'text-zinc-700'
                    }`}
                  >
                    {w}
                  </div>
                ))}
              </div>

              {/* 35 or 42 Days Grid */}
              <div className="grid grid-cols-7 divide-x divide-y divide-zinc-200">
                {gridDays.map((cell, idx) => {
                  const dayEvents = visibleEvents.filter(e => e.date === cell.dateStr);
                  const isSelected = selectedDateStr === cell.dateStr;

                  return (
                    <div
                      key={idx}
                      onClick={() => setSelectedDateStr(cell.dateStr)}
                      className={`min-h-[105px] p-2 flex flex-col justify-between transition-all cursor-pointer relative ${
                        !cell.isCurrentMonth
                          ? 'bg-zinc-50/50 text-zinc-400'
                          : isSelected
                          ? 'bg-orange-50/40 ring-2 ring-inset ring-orange-500'
                          : 'bg-white hover:bg-zinc-50/80 text-zinc-900'
                      }`}
                    >
                      {/* Day Number Header */}
                      <div className="flex items-center justify-between mb-1">
                        <span
                          className={`text-xs font-mono font-bold ${
                            cell.isToday
                              ? 'w-6 h-6 rounded-full bg-orange-600 text-white flex items-center justify-center font-black shadow-xs'
                              : isSelected
                              ? 'font-black text-orange-700'
                              : cell.isCurrentMonth
                              ? 'text-zinc-800'
                              : 'text-zinc-300'
                          }`}
                        >
                          {cell.dayNum}
                        </span>

                        {cell.isToday && (
                          <span className="text-[10px] font-bold text-orange-600 hidden sm:inline">
                            TODAY
                          </span>
                        )}
                      </div>

                      {/* Day Events Stack */}
                      <div className="space-y-1 flex-1 overflow-hidden">
                        {dayEvents.slice(0, 2).map(ev => (
                          <div
                            key={ev.id}
                            title={`${ev.timeSlot || ev.startTime} ${ev.name} (${ev.type})`}
                            className={`truncate text-[10px] font-bold px-1.5 py-0.5 rounded border leading-tight ${getCategoryBadgeColor(
                              ev.type
                            )}`}
                          >
                            <span className="font-mono opacity-80 mr-1">{ev.startTime}</span>
                            <span>{ev.name}</span>
                          </div>
                        ))}

                        {dayEvents.length > 2 && (
                          <div className="text-[10px] font-bold text-zinc-500 px-1">
                            +{dayEvents.length - 2} 更多...
                          </div>
                        )}
                      </div>

                      {/* Dot indicator if events */}
                      {dayEvents.length > 0 && (
                        <div className="pt-1 flex items-center gap-1">
                          {dayEvents.slice(0, 3).map((_, i) => (
                            <div key={i} className="w-1.5 h-1.5 rounded-full bg-orange-500" />
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Selected Day Activity Details Card */}
            <div className="bg-white border border-zinc-200 rounded-xl p-5 shadow-xs space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-zinc-100">
                <div className="flex items-center gap-2">
                  <div className="p-2 bg-orange-50 text-orange-600 rounded-lg border border-orange-200">
                    <Icon name="calendar" className="w-4 h-4" />
                  </div>
                  <div>
                    <h4 className="text-sm font-extrabold text-zinc-900">
                      【{selectedDateStr}】當日活動詳細資訊
                    </h4>
                    <p className="text-xs text-zinc-500">
                      點選月曆中的任意日期即可查看該日活動行程或安排新事項。
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <span className="text-xs font-mono font-bold px-2.5 py-1 rounded bg-zinc-100 text-zinc-700">
                    當日安排 {selectedDayEvents.length} 場活動
                  </span>

                  {isAdmin && onOpenAddEvent && (
                    <button
                      type="button"
                      onClick={() => onOpenAddEvent(selectedDateStr)}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-orange-600 hover:bg-orange-700 text-white font-semibold text-xs rounded-lg shadow-xs transition-colors"
                    >
                      <Icon name="plus" className="w-3.5 h-3.5" />
                      <span>在此日發布活動</span>
                    </button>

              </div>

              {/* Day Events List */}
              {selectedDayEvents.length === 0 ? (

                  <Icon name="calendar" className="w-8 h-8 mx-auto mb-2 text-zinc-300" />
                  <p className="font-semibold text-zinc-500">此日期（{selectedDateStr}）目前沒有排定的活動</p>
                  <p className="text-[11px] text-zinc-400 mt-0.5">可點擊上方月曆切換至其他有標記活動的日期</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {selectedDayEvents.map(ev => {
                    const isCustomSaved = savedIds.includes(ev.id);

                    return (
                      <div
                        key={ev.id}
                        className="border border-zinc-200 rounded-xl p-4 bg-zinc-50/50 hover:bg-white hover:border-orange-300 transition-all shadow-2xs flex flex-col justify-between"
                      >
                        <div className="space-y-2">
                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${getCategoryBadgeColor(ev.type)}`}>
                              {ev.type}
                            </span>
                            <div className="flex items-center gap-1">
                              {ev.departments.map(d => (
                                <span key={d} className="text-[10px] px-1.5 py-0.5 bg-white text-zinc-600 rounded border border-zinc-200 font-medium">
                                  {d}
                                </span>

                          <h5 className="font-extrabold text-sm text-zinc-900 leading-snug">{ev.name}</h5>

                              <Icon name="clock" className="w-3.5 h-3.5 text-zinc-400" />
                              <span>{ev.startTime} - {ev.endTime}</span>
                            </div>
                            {ev.location && (
                              <div className="flex items-center gap-1.5 text-zinc-500 text-[11px]">
                                <Icon name="mapPin" className="w-3.5 h-3.5 text-zinc-400" />
                                <span>{ev.location}</span>
                              </div>
                            )}
                            {ev.description && (
                              <p className="text-xs text-zinc-500 pt-1 leading-relaxed border-t border-zinc-200/60 mt-2">
                                {ev.description}
                              </p>
                            )}
                          </div>
                        </div>

                        {/* Actions */}
                        <div className="mt-4 pt-3 border-t border-zinc-200/70 flex items-center justify-between">
                          {isAdmin && onDeleteEvent && (
                            <button
                              type="button"
                              onClick={() => onDeleteEvent(ev.id, ev.name)}

                            >
                              <Icon name="trash" className="w-3.5 h-3.5" />
                              <span>刪除此活動</span>
                            </button>
                          )}

                          {!isAdmin && onToggleSave && (
                            <button
                              type="button"
                              onClick={() => onToggleSave(ev.id)}
                              className={`text-xs font-bold px-3 py-1.5 rounded-lg border transition-all flex items-center gap-1.5 ${
                                isCustomSaved
                                  ? 'bg-orange-50 text-orange-700 border-orange-300'
                                  : 'bg-white text-zinc-700 border-zinc-300 hover:bg-zinc-50'
                              }`}
                            >
                              <Icon name="star" className={`w-3.5 h-3.5 ${isCustomSaved ? 'fill-orange-500 text-orange-500' : 'text-zinc-400'}`} />
                              <span>{isCustomSaved ? '已在個人行事曆' : '加入個人行事曆'}</span>
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        );
      }

          if (workFilter === 'completed' && t.status !== 'completed') return false;

          return true;

                    <button
                      type="button"
                      onClick={() => setStampFilter('pending')}

                              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${

      function AdminAttendanceTab({ records, members }) {
        const [weekOffset, setWeekOffset] = useState(0);

        const baseMonday = new Date(2026, 8, 14);
        const curMon = new Date(baseMonday);
        curMon.setDate(baseMonday.getDate() + weekOffset * 7);

        const days = Array.from({ length: 7 }, (_, i) => {
          const d = new Date(curMon);
          d.setDate(curMon.getDate() + i);
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const names = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
          return {
            dateStr: `${yyyy}-${mm}-${dd}`,
            display: `${d.getMonth() + 1}月${d.getDate()}日`,
            dayName: names[d.getDay()],
            isToday: `${yyyy}-${mm}-${dd}` === '2026-09-17',
          };
        });

        const slotMap = { morning: '早09-12', afternoon: '午13-17', evening: '晚18-21' };

        return (
          <div className="space-y-6">
            <div className="bg-white border border-zinc-200 rounded-xl p-6 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-1.5 text-xs font-bold text-orange-600 uppercase mb-1">
                  <Icon name="clock" className="w-3.5 h-3.5" />
                  <span>Attendance Weekly Matrix</span>
                </div>
                <h2 className="text-xl font-black text-zinc-900">到校學習與請假週曆列表</h2>
                <p className="text-xs text-zinc-500 mt-1">
                  以「週」為形式呈現，點擊下週或上週可查看其他時間的留校與請假人員。列出一週七天完整名冊。
                </p>
              </div>

              <div className="flex items-center gap-2 bg-zinc-50 p-1 rounded-xl border border-zinc-200 self-start md:self-auto text-xs">
                <button
                  onClick={() => setWeekOffset(weekOffset - 1)}
                  className="px-3 py-1.5 font-semibold text-zinc-700 hover:bg-white rounded-lg flex items-center gap-1"
                >
                  <Icon name="chevronLeft" className="w-4 h-4" />
                  <span>上週</span>
                </button>
                <button
                  onClick={() => setWeekOffset(0)}
                  className={`px-3 py-1.5 font-bold rounded-lg ${weekOffset === 0 ? 'bg-zinc-900 text-white' : 'text-zinc-600 hover:bg-white'}`}
                >
                  本週
                </button>
                <button
                  onClick={() => setWeekOffset(weekOffset + 1)}
                  className="px-3 py-1.5 font-semibold text-zinc-700 hover:bg-white rounded-lg flex items-center gap-1"
                >
                  <span>下週</span>
                  <Icon name="chevronRight" className="w-4 h-4" />
                </button>
              </div>
            </div>

            <div className="text-xs text-zinc-500 font-bold px-1">
              週次區間：{days[0].display} ({days[0].dayName}) ～ {days[6].display} ({days[6].dayName})
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
              {days.map(day => {
                const dayRecs = records.filter(r => r.date === day.dateStr);
                const presents = dayRecs.filter(r => r.type === 'attendance');
                const leaves = dayRecs.filter(r => r.type === 'leave');

                return (
                  <div
                    key={day.dateStr}
                    className={`bg-white border rounded-xl shadow-xs overflow-hidden flex flex-col justify-between ${
                      day.isToday ? 'border-orange-500 ring-2 ring-orange-500/10' : 'border-zinc-200'
                    }`}
                  >
                    <div className={`p-3 border-b flex items-center justify-between ${day.isToday ? 'bg-orange-50' : 'bg-zinc-50'}`}>
                      <div className="flex items-center gap-2">
                        <span className="font-extrabold text-sm text-zinc-900">{day.display}</span>
                        <span className="text-xs font-semibold px-2 py-0.5 rounded bg-zinc-200 text-zinc-700">{day.dayName}</span>
                      </div>
                      {day.isToday && (
                        <span className="text-[10px] font-extrabold text-white bg-orange-600 px-2 py-0.5 rounded">
                          TODAY
                        </span>
                      )}
                    </div>

                    <div className="p-3.5 space-y-3 flex-1 text-xs">
                      <div>
                        <span className="font-bold text-emerald-800 block mb-1">
                          🟢 留校名單 ({presents.length} 人)
                        </span>
                        {presents.length === 0 ? (
                          <p className="text-zinc-400 text-[11px] italic">尚無留校人員</p>
                        ) : (
                          <div className="space-y-1">
                            {presents.map(p => (
                              <div key={p.id} className="p-1.5 bg-emerald-50/60 rounded border border-emerald-200 flex justify-between">
                                <span className="font-bold text-zinc-900">{p.studentName}</span>
                                <span className="text-[10px] font-mono text-zinc-600">{p.slots.map(s => slotMap[s]).join(', ')}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      <div>
                        <span className="font-bold text-amber-800 block mb-1">
                          🟠 請假人員 ({leaves.length} 人)
                        </span>
                        {leaves.length === 0 ? (
                          <p className="text-zinc-400 text-[11px] italic">全員出席無請假</p>
                        ) : (
                          <div className="space-y-1">
                            {leaves.map(l => (
                              <div key={l.id} className="p-1.5 bg-amber-50/60 rounded border border-amber-200 text-xs">
                                <div className="flex justify-between">
                                  <span className="font-bold text-zinc-900">{l.studentName}</span>
                                  <span className="text-[10px] text-zinc-500 font-mono">{l.slots.map(s => slotMap[s]).join(', ')}</span>
                                </div>
                                {l.reason && <p className="text-[10px] text-zinc-500 italic mt-0.5">事由：{l.reason}</p>}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      function MemberProfileTab({
        member,
        tasks,
        events,
        onUpdateProfile,
        onSaveMotto,
        onUpdateAvatar,
        onRemoveAvatar,
        onUpdatePassword,
        onOpenAddAdmin,
        onOpenFirebaseConfig
      }) {
        const [motto, setMotto] = useState(member.motto || '');
        const [isEditing, setIsEditing] = useState(false);
        const fileInputRef = React.useRef(null);

        // Edit Profile modal state
        const [isEditProfileOpen, setIsEditProfileOpen] = useState(false);
        const [editName, setEditName] = useState(member.name || '');
        const [editPhone, setEditPhone] = useState(member.phone || '');
        const [editEmail, setEditEmail] = useState(member.email || '');
        const [editMotto, setEditMotto] = useState(member.motto || '');
        const [editDepartments, setEditDepartments] = useState(member.departments || ['機電整合組']);

        useEffect(() => {
          setEditName(member.name || '');
          setEditPhone(member.phone || '');
          setEditEmail(member.email || '');
          setEditMotto(member.motto || '');
          setEditDepartments(member.departments || ['機電整合組']);
        }, [member.id, member.name, member.phone, member.email, member.motto, member.departments]);

        const toggleEditDept = (deptName) => {
          setEditDepartments(prev => {
            if (prev.includes(deptName)) {
              if (prev.length === 1) {
                alert('隊員至少需保留一個所屬組別！');
                return prev;
              }
              return prev.filter(d => d !== deptName);
            } else {
              return [...prev, deptName];
            }
          });
        };

        const handleSaveProfileForm = (e) => {
          e.preventDefault();
          if (!editName.trim()) {
            alert('姓名不得為空');
            return;
          }
          const finalDepartments = member.role === 'admin' ? editDepartments : member.departments;
          if (onUpdateProfile) {
            const ok = onUpdateProfile({
              id: member.id,
              name: editName.trim(),
              phone: editPhone.trim(),
              email: editEmail.trim(),
              motto: editMotto.trim(),
              departments: finalDepartments,
            });
            if (ok) {
              setIsEditProfileOpen(false);
            }
          }
        };

        // Password change form state
        const [oldPass, setOldPass] = useState('');
        const [newPass, setNewPass] = useState('');
        const [confirmPass, setConfirmPass] = useState('');
        const [showPassSection, setShowPassSection] = useState(false);
        const [showOldPass, setShowOldPass] = useState(false);
        const [showNewPass, setShowNewPass] = useState(false);
        const [passErr, setPassErr] = useState('');
        const [passSuccess, setPassSuccess] = useState('');

        useEffect(() => {
          setMotto(member.motto || '');
        }, [member.id, member.motto]);

        const myTasks = tasks.filter(t => t.studentId === member.id);
        const myEvents = events.filter(e => e.departments.some(d => member.departments.includes(d)));

        const handleImageFileChange = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          if (!file.type.startsWith('image/')) {
            alert('請選擇圖片檔案（支援 JPG、PNG、WebP、GIF 等）');
            return;
          }
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const maxDim = 320;
              let width = img.width;
              let height = img.height;
              if (width > height) {
                if (width > maxDim) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                }
              } else {
                if (height > maxDim) {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
              if (onUpdateAvatar) onUpdateAvatar(member.id, dataUrl);
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        };

        const handlePasswordSubmit = (e) => {
          e.preventDefault();
          setPassErr('');
          setPassSuccess('');
          if (!oldPass) {
            setPassErr('請輸入舊密碼');
            return;
          }
          if (!newPass || newPass.length < 4) {
            setPassErr('新密碼長度至少需 4 個字元');
            return;
          }
          if (newPass !== confirmPass) {
            setPassErr('兩次輸入的新密碼不相符，請再次確認');
            return;
          }
          if (onUpdatePassword) {
            const ok = onUpdatePassword(member.id, oldPass, newPass);
            if (ok) {
              setOldPass('');
              setNewPass('');
              setConfirmPass('');
              setPassSuccess('✅ 密碼已成功變更！下次登入時請使用新密碼。');
              setTimeout(() => setPassSuccess(''), 5000);
            } else {
              setPassErr('舊密碼不正確，變更失敗');
            }
          }
        };

        return (
          <div className="space-y-6">
            {/* Top Avatar & Profile Header Card */}

                    className="w-18 h-18 sm:w-20 sm:h-20 rounded-2xl bg-zinc-950 text-white flex items-center justify-center font-black text-2xl sm:text-3xl border border-zinc-800 shadow-sm overflow-hidden cursor-pointer relative hover:border-orange-500 transition-all select-none"
                  >
                    {member.avatar ? (
                      <img
                        src={member.avatar}
                        alt={member.name}
                        className="w-full h-full object-cover"
                      />
                    ) : (
                      <span className="text-orange-500">{member.name.slice(0, 1)}</span>
                    )}

                    {/* Hover Overlay */}
                    <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center text-white gap-1 text-[11px] font-bold">
                      <Icon name="camera" className="w-5 h-5 text-orange-400" />
                      <span>{member.avatar ? '更換' : '上傳'}</span>
                    </div>
                  </div>

                  {/* Corner Camera Button Badge */}

                    type="button"
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    title="更換相片"
                    className="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-orange-600 hover:bg-orange-700 text-white flex items-center justify-center shadow-md border-2 border-white transition-transform hover:scale-110"
                  >
                    <Icon name="camera" className="w-3 h-3" />
                  </button>

                  <input
                    ref={fileInputRef}
                    type="file"
                    accept="image/*"
                    onChange={handleImageFileChange}
                    className="hidden"
                  />
                </div>

                <div className="space-y-1">
                  <div className="flex flex-wrap items-center gap-2">
                    <h2 className="text-2xl font-black text-zinc-900">{member.name}</h2>
                    <span className="font-mono text-xs font-bold px-2 py-0.5 bg-zinc-900 text-white rounded">
                      {member.id}
                    </span>
                    {member.role === 'admin' && (
                      <span className="px-2 py-0.5 text-xs font-bold bg-orange-100 text-orange-700 rounded-full border border-orange-300 flex items-center gap-1">

      function ParentPortalTab({ studentName, members, events, attendanceRecords, portalTab }) {

        curMon.setDate(baseMonday.getDate() + offset * 7);

        const days = Array.from({ length: 7 }, (_, i) => {
          const d = new Date(curMon);
          d.setDate(curMon.getDate() + i);
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const names = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
          return {
            dateStr: `${yyyy}-${mm}-${dd}`,
            display: `${d.getMonth() + 1}月${d.getDate()}日`,
            dayName: names[d.getDay()],
            isToday: `${yyyy}-${mm}-${dd}` === '2026-09-17',
          };
        });

        const slotMap = { morning: '早09-12', afternoon: '午13-17', evening: '晚18-21' };

        const matchedStudent = members.find(m => m.name.includes(studentName) || studentName.includes(m.name));

        const studentRecs = attendanceRecords.filter(r =>
          (matchedStudent ? r.studentId === matchedStudent.id : r.studentName.includes(studentName)) &&
          days.some(d => d.dateStr === r.date)

        return (
          <div className="space-y-6">
            <div className="bg-gradient-to-r from-orange-50 via-white to-amber-50/40 border border-orange-200 rounded-2xl p-6 shadow-xs">

                </div>
                {matchedStudent && (
                  <div className="p-3 bg-white border border-orange-200 rounded-xl text-xs flex items-center gap-3 shadow-2xs">
                    <div className="w-12 h-12 rounded-xl bg-zinc-950 text-white flex items-center justify-center font-black text-lg border border-zinc-800 overflow-hidden flex-shrink-0">

      // --- FIREBASE CLOUD DATABASE MODAL COMPONENT ---
      function FirebaseConfigModal({ isOpen, onClose, config, onSaveConfig, isConnected, onSeedToCloud, isSyncing, showToast }) {
        const [activeSubTab, setActiveSubTab] = useState('config'); // 'config' | 'guide'
        const [apiKey, setApiKey] = useState(config?.apiKey || '');
        const [authDomain, setAuthDomain] = useState(config?.authDomain || '');
        const [projectId, setProjectId] = useState(config?.projectId || '');
        const [storageBucket, setStorageBucket] = useState(config?.storageBucket || '');
        const [messagingSenderId, setMessagingSenderId] = useState(config?.messagingSenderId || '');
        const [appId, setAppId] = useState(config?.appId || '');
        const [jsonInput, setJsonInput] = useState('');
        const [statusMsg, setStatusMsg] = useState('');

        useEffect(() => {
          if (config) {
            setApiKey(config.apiKey || '');
            setAuthDomain(config.authDomain || '');
            setProjectId(config.projectId || '');
            setStorageBucket(config.storageBucket || '');
            setMessagingSenderId(config.messagingSenderId || '');
            setAppId(config.appId || '');
          }
        }, [config]);

        if (!isOpen) return null;

        const handlePasteJson = () => {
          try {
            let str = jsonInput.trim();
            const braceStart = str.indexOf('{');
            const braceEnd = str.lastIndexOf('}');
            if (braceStart !== -1 && braceEnd !== -1) {
              str = str.substring(braceStart, braceEnd + 1);
            }
            const parsed = new Function(`return ${str}`)();
            if (parsed && typeof parsed === 'object') {
              if (parsed.apiKey) setApiKey(parsed.apiKey);
              if (parsed.authDomain) setAuthDomain(parsed.authDomain);
              if (parsed.projectId) setProjectId(parsed.projectId);
              if (parsed.storageBucket) setStorageBucket(parsed.storageBucket);
              if (parsed.messagingSenderId) setMessagingSenderId(parsed.messagingSenderId);
              if (parsed.appId) setAppId(parsed.appId);
              setStatusMsg('✅ 已成功解析並填入 Firebase 設定參數！');
              setJsonInput('');
            } else {
              setStatusMsg('⚠️ 無法解析輸入內容，請確認格式');
            }
          } catch (e) {
            setStatusMsg('⚠️ 解析失敗：請確保格式為標準 JavaScript 物件或 JSON');
          }
        };

        const handleSave = () => {
          if (!apiKey.trim() || !projectId.trim()) {
            setStatusMsg('⚠️ API Key 與 Project ID 為必填欄位');
            return;
          }
          const newCfg = {
            apiKey: apiKey.trim(),
            authDomain: authDomain.trim(),
            projectId: projectId.trim(),
            storageBucket: storageBucket.trim(),
            messagingSenderId: messagingSenderId.trim(),
            appId: appId.trim(),
          };
          onSaveConfig(newCfg);
          setStatusMsg('✅ Firebase 設定已儲存！系統正連線至 Cloud Firestore...');
          if (showToast) showToast('Firebase 設定已更新', '正連接 Cloud Firestore 雲端資料庫', 'success');
        };

        const handleClear = () => {
          if (window.confirm('確定要清除 Firebase 連線設定嗎？系統將回到本機儲存 (LocalStorage) 模式。')) {
            onSaveConfig(null);
            setApiKey('');
            setAuthDomain('');
            setProjectId('');
            setStorageBucket('');
            setMessagingSenderId('');
            setAppId('');
            setStatusMsg('已切換回純本機模式');
            if (showToast) showToast('已切換至本機模式', '資料將安全保留於本機瀏覽器中', 'info');
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-xs">
            <div className="bg-white border border-zinc-200 w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">
              <div className="bg-zinc-950 p-5 text-white flex items-center justify-between border-b border-zinc-800">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-orange-600/20 text-orange-500 flex items-center justify-center border border-orange-500/30">
                    <Icon name="cloud" className="w-5 h-5" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h3 className="font-extrabold text-base">Firebase 雲端資料庫設定</h3>
                      {isConnected ? (
                        <span className="px-2 py-0.5 text-[10px] font-bold bg-emerald-500/20 text-emerald-400 rounded-full border border-emerald-500/30 flex items-center gap-1">
                          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                          連線正常 (Syncing)
                        </span>
                      ) : (
                        <span className="px-2 py-0.5 text-[10px] font-bold bg-amber-500/20 text-amber-400 rounded-full border border-amber-500/30">
                          本機模式 (Offline)
                        </span>
                      )}
                    </div>
                    <p className="text-xs text-zinc-400">雙向即時同步手機與電腦隊務資料，支援多裝置即時協作</p>
                  </div>
                </div>
                <button
                  type="button"
                  onClick={onClose}
                  className="w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors"
                >
                  <Icon name="x" className="w-5 h-5" />

              {/* Subtabs */}

                <button
                  onClick={() => setActiveSubTab('config')}
                  className={`pb-2 px-3 border-b-2 transition-colors ${
                    activeSubTab === 'config' ? 'border-orange-600 text-orange-600' : 'border-transparent text-zinc-500 hover:text-zinc-900'

                  連線參數設定

                <button

                      <div className="flex items-center justify-between">

                        >
                          <Icon name="cloudCheck" className="w-4 h-4" />
                          <span>{isSyncing ? '同步中...' : '一鍵推送到雲端'}</span>
                        </button>
                      </div>
                    </div>

                    {/* Multi-Device Auto-Sync Export */}
                    <div className="p-4 bg-zinc-50 border border-zinc-200 rounded-xl space-y-3">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                          <div className="font-bold text-zinc-900 text-xs">全隊多裝置免輸入自動連線檔 (firebase-config.json)</div>
                          <p className="text-[11px] text-zinc-500 mt-0.5">下載此設定檔放入專案 public/ 資料夾並推送到 GitHub，所有隊員手機與電腦開啟網頁均自動雙向連線！</p>
                        </div>
                        <button
                          type="button"
                          onClick={() => {
                            if (!apiKey || !projectId) {
                              alert('請先填寫 API Key 與 Project ID');
                              return;
                            }
                            const cfg = { apiKey, authDomain, projectId, storageBucket, messagingSenderId, appId };
