                            setStatusMsg('✅ 已下載 firebase-config.json！將此檔放入專案 public 資料夾並推送到 GitHub，所有隊員免輸入即可自動連線。');
                          }}
                          className="px-3.5 py-2 bg-zinc-900 hover:bg-zinc-800 text-white font-bold rounded-lg text-xs shadow-xs flex items-center justify-center gap-1.5 flex-shrink-0"
                        >
                          <Icon name="download" className="w-4 h-4 text-orange-400" />
                          <span>下載共用設定檔</span>
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              <div className="p-4 bg-zinc-50 border-t border-zinc-200 flex items-center justify-between">
                <div>
                  {config && (
                    <button
                      type="button"
                      onClick={handleClear}
                      className="px-3 py-1.5 text-zinc-500 hover:text-red-600 font-medium text-xs hover:underline"
                    >
                      清除設定 (切回純本機)
                    </button>
                  )}
                </div>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 border border-zinc-200 text-zinc-600 hover:bg-zinc-100 rounded-lg text-xs font-medium"
                  >
                    關閉
                  </button>
                  {activeSubTab === 'config' && (
                    <button
                      type="button"
                      onClick={handleSave}
                      className="px-5 py-2 bg-zinc-900 hover:bg-zinc-800 text-white font-bold rounded-lg text-xs shadow-xs"

                      儲存連線設定

              </div>
            </div>
          </div>
        );
      }

      // --- 5. SECURE ROLE LOGIN MODAL (REQUIRES PASSWORD FOR ALL ROLES) ---
      function RoleLoginModal({ members, onClose, onSelectRole, isPageMode = false }) {
        const [tab, setTab] = useState('admin');

        // Admin Auth State
        const adminMembers = useMemo(() => {
          return members
            .filter(m => m.role === 'admin' || m.id === '10114-001' || (m.id && m.id.startsWith('10114-ADM')))
            .sort((a, b) => (a.id || '').localeCompare(b.id || '', undefined, { numeric: true, sensitivity: 'base' }));
        }, [members]);

        // Student Members (strictly excluding coaches and admins)
        const studentMembers = useMemo(() => {
          return members
            .filter(m => m.role !== 'admin' && m.id !== '10114-001' && !(m.id && m.id.startsWith('10114-ADM')))
            .sort((a, b) => (a.id || '').localeCompare(b.id || '', undefined, { numeric: true, sensitivity: 'base' }));
        }, [members]);

        const [selectedAdminId, setSelectedAdminId] = useState(adminMembers[0]?.id || '10114-001');
        const [adminPassword, setAdminPassword] = useState('');
        const [showAdminPass, setShowAdminPass] = useState(false);
        const [adminErr, setAdminErr] = useState('');

        // Member Auth State
        const [memberId, setMemberId] = useState(studentMembers[0]?.id || '10114-002');
        const [memberPassword, setMemberPassword] = useState('');
        const [showMemberPass, setShowMemberPass] = useState(false);
        const [memberErr, setMemberErr] = useState('');

        // Parent Auth State
        const [parentStudentId, setParentStudentId] = useState(studentMembers[0]?.id || '10114-002');
        const [parentPassword, setParentPassword] = useState('');
        const [showParentPass, setShowParentPass] = useState(false);
        const [parentErr, setParentErr] = useState('');

        useEffect(() => {
          if (adminMembers.length > 0 && !adminMembers.some(a => a.id === selectedAdminId)) {
            setSelectedAdminId(adminMembers[0].id);
          }
        }, [adminMembers]);

        useEffect(() => {
          if (studentMembers.length > 0 && !studentMembers.some(s => s.id === memberId)) {
            setMemberId(studentMembers[0].id);
          }
        }, [studentMembers]);

        useEffect(() => {
          if (studentMembers.length > 0 && !studentMembers.some(s => s.id === parentStudentId)) {
            setParentStudentId(studentMembers[0].id);
          }
        }, [studentMembers]);

        // Admin Submit Handler
        const handleAdminSubmit = (e) => {
          e.preventDefault();
          const targetAdmin = adminMembers.find(m => m.id === selectedAdminId) || adminMembers[0] || members[0];
          const expected = targetAdmin?.password || '10114admin';
          if (adminPassword.trim() !== expected) {
            setAdminErr('管理員密碼錯誤！請重新輸入（預設密碼：10114admin）');
            return;
          }
          setAdminErr('');
          onSelectRole('admin', targetAdmin);
        };

        // Member Submit Handler
        const handleMemberSubmit = (e) => {
          e.preventDefault();
          const targetMember = studentMembers.find(m => m.id === memberId) || studentMembers[0];
          if (!targetMember) {
            setMemberErr('無可登入的隊員帳號');
            return;
          }
          const expected = targetMember?.password || '10114';
          if (memberPassword.trim() !== expected) {
            setMemberErr('隊員密碼錯誤！請重新輸入（預設密碼：10114）');
            return;
          }
          setMemberErr('');
          onSelectRole('member', targetMember);
        };

        // Parent Submit Handler
        const handleParentSubmit = (e) => {
          e.preventDefault();
          const selectedStudent = studentMembers.find(m => m.id === parentStudentId) || studentMembers[0];
          if (!selectedStudent) {
            setParentErr('請先選擇欲關心的學生');
            return;
          }
          const expectedPass = selectedStudent?.password || '10114';
          if (parentPassword.trim() !== expectedPass && parentPassword.trim() !== '10114') {
            setParentErr('家長安全通關碼錯誤！（預設密碼與學生相同為：10114）');
            return;
          }
          setParentErr('');
          onSelectRole('parent', undefined, selectedStudent.name);
        };

        const currentSelAdmin = adminMembers.find(m => m.id === selectedAdminId) || adminMembers[0];
        const currentSelMember = studentMembers.find(m => m.id === memberId) || studentMembers[0];
        const currentSelStudentForParent = studentMembers.find(m => m.id === parentStudentId) || studentMembers[0];

        const outerClass = isPageMode
          ? "min-h-screen bg-[#fafafa] flex flex-col items-center justify-center p-4 sm:p-6"
          : "fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-xs";
        const cardClass = isPageMode
          ? "bg-white border border-zinc-200 w-full max-w-lg rounded-2xl shadow-xl overflow-hidden"
          : "bg-white border border-zinc-200 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200";

        return (

            <div className={cardClass}>

                  <button
                    type="button"
                    onClick={onClose}
                    className="absolute top-4 right-4 w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors"
                    title="關閉"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                )}
                <div className="inline-block px-3 py-1 bg-orange-500/15 text-orange-400 text-xs font-bold rounded-full mb-2">
                  新北市立錦和高級中學機器人校隊
                </div>
                <h2 className="text-xl font-black">FRC 10114 隊務管理系統</h2>
                <p className="text-xs text-zinc-400 mt-1">請選擇您的身分並輸入登入密碼</p>
              </div>

              {/* Role Selection Tabs */}
              <div className="grid grid-cols-3 border-b border-zinc-200 bg-zinc-50 p-1.5 gap-1">
                <button
                  type="button"
                  onClick={() => { setTab('admin'); setAdminErr(''); }}
                  className={`py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                    tab === 'admin' ? 'bg-white text-orange-600 shadow-xs' : 'text-zinc-600 hover:text-zinc-900'
                  }`}
                >
                  <Icon name="shieldCheck" className="w-3.5 h-3.5" />
                  <span>管理員登入</span>
                </button>
                <button
                  type="button"
                  onClick={() => { setTab('member'); setMemberErr(''); }}
                  className={`py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                    tab === 'member' ? 'bg-white text-orange-600 shadow-xs' : 'text-zinc-600 hover:text-zinc-900'
                  }`}
                >
                  <Icon name="user" className="w-3.5 h-3.5" />
                  <span>隊員登入</span>
                </button>
                <button
                  type="button"
                  onClick={() => { setTab('parent'); setParentErr(''); }}
                  className={`py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                    tab === 'parent' ? 'bg-white text-orange-600 shadow-xs' : 'text-zinc-600 hover:text-zinc-900'
                  }`}
                >
                  <Icon name="heart" className="w-3.5 h-3.5" />
                  <span>家長登入</span>
                </button>
              </div>

              <div className="p-6">
                {/* 1. ADMIN LOGIN */}
                {tab === 'admin' && (
                  <form onSubmit={handleAdminSubmit} className="space-y-4">
                    <div className="p-3 bg-orange-50 border border-orange-200 rounded-xl text-xs text-orange-950 flex items-start gap-2.5">
                      <Icon name="shieldCheck" className="w-4 h-4 text-orange-600 flex-shrink-0 mt-0.5" />
                      <div>
                        <strong>管理員教練專屬入口：</strong>具備名冊增修、新增教練、機具排程、設備管理、專案審核與資料庫連線權限。
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-zinc-700 mb-1">選擇管理員教練帳號</label>
                      <select
                        value={selectedAdminId}
                        onChange={(e) => { setSelectedAdminId(e.target.value); setAdminErr(''); }}
                        className="w-full p-2.5 border border-zinc-300 rounded-lg text-xs font-bold text-zinc-900"
                      >
                        {adminMembers.map(a => (
                          <option key={a.id} value={a.id}>{a.name} ({a.id})</option>
                        ))}
                      </select>
                    </div>

                    {currentSelAdmin && (
                      <div className="flex items-center gap-3 p-3 bg-zinc-50 border border-zinc-200 rounded-xl">
                        <div className="w-10 h-10 rounded-xl bg-zinc-950 text-white flex items-center justify-center font-bold text-sm border border-zinc-800 overflow-hidden flex-shrink-0">
                          {currentSelAdmin.avatar ? (
                            <img src={currentSelAdmin.avatar} alt={currentSelAdmin.name} className="w-full h-full object-cover" />
                          ) : (
                            <span className="text-orange-500 font-black">{currentSelAdmin.name.slice(0, 1)}</span>
                          )}
                        </div>
                        <div className="min-w-0 flex-1">
                          <div className="text-xs font-bold text-zinc-900 flex items-center gap-1.5">
                            <span>{currentSelAdmin.name}</span>
                            <span className="font-mono text-[11px] text-zinc-400">({currentSelAdmin.id})</span>
                            <span className="px-1.5 py-0.5 text-[10px] font-bold bg-orange-100 text-orange-700 rounded">管理員</span>
                          </div>
                          <div className="text-[11px] text-zinc-500 truncate mt-0.5">FRC 10114 指導教練 / 系統管理</div>
                        </div>
                      </div>
                    )}

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-xs font-bold text-zinc-700">管理員密碼</label>
                        <span className="text-[11px] text-zinc-400">預設密碼：10114admin</span>
                      </div>
                      <div className="relative">
                        <input
                          type={showAdminPass ? 'text' : 'password'}
                          value={adminPassword}
                          onChange={(e) => { setAdminPassword(e.target.value); setAdminErr(''); }}
                          placeholder="請輸入管理員密碼 (預設 10114admin)"
                          className="w-full p-2.5 pr-10 border border-zinc-300 rounded-lg text-xs font-mono font-medium text-zinc-900 focus:ring-2 focus:ring-orange-500"
                        />
                        <button
                          type="button"
                          onClick={() => setShowAdminPass(!showAdminPass)}
                          className="absolute right-2.5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600 p-1"
                        >
                          <Icon name={showAdminPass ? 'eyeOff' : 'eye'} className="w-4 h-4" />
                        </button>
                      </div>
                    </div>

                    {adminErr && (
                      <div className="p-2.5 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700 font-bold flex items-center gap-2 animate-in fade-in">
                        <Icon name="alert" className="w-4 h-4 flex-shrink-0" />
                        <span>{adminErr}</span>
                      </div>
                    )}

                    <button
                      type="submit"
                      className="w-full py-3 bg-zinc-900 hover:bg-zinc-800 text-white font-bold rounded-lg text-xs shadow-xs transition-colors flex items-center justify-center gap-2"
                    >
                      <Icon name="lock" className="w-4 h-4 text-orange-400" />
                      <span>驗證密碼並登入管理員</span>
                    </button>
                  </form>
                )}

                {/* 2. MEMBER LOGIN */}
                {tab === 'member' && (
                  <form onSubmit={handleMemberSubmit} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-700 mb-1">選擇登入隊員</label>
                      <select
                        value={memberId}
                        onChange={(e) => { setMemberId(e.target.value); setMemberErr(''); }}
                        className="w-full p-2.5 border border-zinc-300 rounded-lg text-xs font-medium text-zinc-900"
                      >
                        {studentMembers.map(m => (
                          <option key={m.id} value={m.id}>
                            {m.id} - {m.name} ({m.departments ? m.departments.join('/') : ''})
                          </option>
                        ))}
                      </select>
                    </div>

                    {currentSelMember && (
                      <div className="flex items-center gap-3 p-3 bg-zinc-50 border border-zinc-200 rounded-xl">
                        <div className="w-11 h-11 rounded-xl bg-zinc-950 text-white flex items-center justify-center font-bold text-sm border border-zinc-800 overflow-hidden flex-shrink-0">
                          {currentSelMember.avatar ? (
                            <img src={currentSelMember.avatar} alt={currentSelMember.name} className="w-full h-full object-cover" />
                          ) : (
                            <span className="text-orange-500 font-black">{currentSelMember.name.slice(0, 1)}</span>
                          )}
                        </div>
                        <div className="min-w-0 flex-1">
                          <div className="text-xs font-bold text-zinc-900 flex items-center gap-1.5">
                            <span>{currentSelMember.name}</span>
                            <span className="font-mono text-[11px] text-zinc-400">({currentSelMember.id})</span>
                          </div>
                          <div className="text-[11px] text-zinc-500 truncate mt-0.5">
                            {currentSelMember.departments ? currentSelMember.departments.join(' · ') : ''}
                          </div>
                        </div>
                      </div>
                    )}

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-xs font-bold text-zinc-700">隊員登入密碼</label>
                        <span className="text-[11px] text-zinc-400">預設密碼：10114</span>
                      </div>
                      <div className="relative">
                        <input
                          type={showMemberPass ? 'text' : 'password'}
                          value={memberPassword}
                          onChange={(e) => { setMemberPassword(e.target.value); setMemberErr(''); }}
                          placeholder="請輸入隊員密碼 (預設 10114)"
                          className="w-full p-2.5 pr-10 border border-zinc-300 rounded-lg text-xs font-mono font-medium text-zinc-900 focus:ring-2 focus:ring-orange-500"
                        />
                        <button
                          type="button"
                          onClick={() => setShowMemberPass(!showMemberPass)}
                          className="absolute right-2.5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600 p-1"
                        >
                          <Icon name={showMemberPass ? 'eyeOff' : 'eye'} className="w-4 h-4" />
                        </button>
                      </div>
                    </div>

                    {memberErr && (
                      <div className="p-2.5 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700 font-bold flex items-center gap-2 animate-in fade-in">
                        <Icon name="alert" className="w-4 h-4 flex-shrink-0" />
                        <span>{memberErr}</span>
                      </div>
                    )}

                    <button
                      type="submit"
                      className="w-full py-3 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-lg text-xs shadow-xs transition-colors flex items-center justify-center gap-2"
                    >
                      <Icon name="lock" className="w-4 h-4 text-white" />
                      <span>以隊員身分登入</span>
                    </button>
                  </form>
                )}

                {/* 3. PARENT LOGIN */}
                {tab === 'parent' && (
                  <form onSubmit={handleParentSubmit} className="space-y-4">
                    <div className="p-3 bg-orange-50 border border-orange-200 rounded-xl text-xs text-orange-950 flex items-start gap-2.5">
                      <Icon name="heart" className="w-4 h-4 text-orange-600 flex-shrink-0 mt-0.5" />
                      <div>
                        <strong>家長關心通道：</strong>請從隊員名冊中選擇您的孩子，登入後可即時查看其留校實作考勤、請假審核狀態與近期重要賽事行事曆。
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-zinc-700 mb-1">選擇學生姓名（孩子）</label>
                      <select
                        value={parentStudentId}
                        onChange={(e) => { setParentStudentId(e.target.value); setParentErr(''); }}
                        className="w-full p-2.5 border border-zinc-300 rounded-lg text-xs font-bold text-zinc-900 focus:ring-2 focus:ring-orange-500"
                      >
                        {studentMembers.map(s => (
                          <option key={s.id} value={s.id}>
                            {s.name} ({s.id} · {s.departments ? s.departments.join('/') : '無組別'})
                          </option>
                        ))}
                      </select>
                    </div>

                    {currentSelStudentForParent && (
                      <div className="flex items-center gap-3 p-3 bg-zinc-50 border border-zinc-200 rounded-xl">
                        <div className="w-10 h-10 rounded-xl bg-orange-50 text-orange-600 border border-orange-200 flex items-center justify-center font-bold text-sm overflow-hidden flex-shrink-0">
                          {currentSelStudentForParent.avatar ? (
                            <img src={currentSelStudentForParent.avatar} alt={currentSelStudentForParent.name} className="w-full h-full object-cover" />
                          ) : (
                            <span>{currentSelStudentForParent.name.slice(0, 1)}</span>
                          )}
                        </div>
                        <div className="min-w-0 flex-1">
                          <div className="text-xs font-bold text-zinc-900 flex items-center gap-1.5">
                            <span>{currentSelStudentForParent.name} 的家長</span>
                            <span className="font-mono text-[11px] text-zinc-400">({currentSelStudentForParent.id})</span>
                          </div>
                          <div className="text-[11px] text-zinc-500 truncate mt-0.5">
                            所屬：{currentSelStudentForParent.departments ? currentSelStudentForParent.departments.join(' · ') : '尚未分配'}
                          </div>
                        </div>
                      </div>
                    )}

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-xs font-bold text-zinc-700">家長安全通關密碼</label>
                        <span className="text-[11px] text-zinc-400">預設密碼：10114</span>
                      </div>
                      <div className="relative">
                        <input
                          type={showParentPass ? 'text' : 'password'}
                          value={parentPassword}
                          onChange={(e) => { setParentPassword(e.target.value); setParentErr(''); }}
                          placeholder="請輸入通關密碼（預設 10114）"
                          className="w-full p-2.5 pr-10 border border-zinc-300 rounded-lg text-xs font-mono font-medium text-zinc-900 focus:ring-2 focus:ring-orange-500"
                        />
                        <button
                          type="button"
                          onClick={() => setShowParentPass(!showParentPass)}
                          className="absolute right-2.5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600 p-1"
                        >
                          <Icon name={showParentPass ? 'eyeOff' : 'eye'} className="w-4 h-4" />
                        </button>
                      </div>

                    {parentErr && (
                      <div className="p-2.5 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700 font-bold flex items-center gap-2 animate-in fade-in">

                    <button
                      type="submit"
                      className="w-full py-3 bg-zinc-900 hover:bg-zinc-800 text-white font-bold rounded-lg text-xs shadow-xs transition-colors flex items-center justify-center gap-2"
                    >
                      <Icon name="heart" className="w-4 h-4 text-orange-400" />

                )}
              </div>
            </div>
            {isPageMode && (
              <div className="text-center mt-6 text-xs text-zinc-400 space-y-1">
                <div className="font-semibold text-zinc-600">新北市立錦和高級中學機器人校隊 • FRC Team 10114</div>
                <div className="text-[11px] text-zinc-400">登入後將依照您的身分自動跳轉至個人專屬頁面</div>
              </div>
            )}
          </div>
        );
      }


      // Mount to DOM
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
